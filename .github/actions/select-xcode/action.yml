name: Select Xcode 27
description: Switches to the newest Xcode 27 on the runner; Lax needs the macOS 27 SDK.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Released versions first; a release candidate only if that's all there is.
        candidates="$(ls -d /Applications/Xcode_27*.app 2>/dev/null || true)"
        xcode="$(echo "$candidates" | grep -v Release_Candidate | sort -V | tail -n 1 || true)"
        [ -z "$xcode" ] && xcode="$(echo "$candidates" | sort -V | tail -n 1)"
        if [ -z "$xcode" ]; then
          echo "::error::Lax needs Xcode 27 (the macOS 27 SDK); this runner has: $(ls -d /Applications/Xcode*.app | xargs)"
          exit 1
        fi
        sudo xcode-select --switch "$xcode"
        xcodebuild -version
        swift --version
