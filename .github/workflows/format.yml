name: Format

# Fails when swift-format would change any file; run `swift format format --in-place
# --recursive Sources Tests Package.swift` to fix it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: swift format format
        run: swift format format --in-place --recursive Sources Tests Package.swift
      - name: Check for changes
        run: git diff --exit-code
